<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="compose-reorderable: drag and drop reordering for LazyColumn, LazyRow and LazyVerticalGrid in Jetpack Compose" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a1240"/>
      <stop offset="1" stop-color="#3a2a8c"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f9f7ff"/>
      <stop offset="1" stop-color="#eeeaf8"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="lift" x="-20%" y="-60%" width="140%" height="260%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#1a1240" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="560" fill="url(#bg)"/>
  <g font-family="'Google Sans', Roboto, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="72" y="166" fill="#ffffff" font-size="54" font-weight="800" letter-spacing="-2">compose-reorderable</text>
    <text x="74" y="218" fill="#ddd6ff" font-size="26" font-weight="500">Drag and drop reordering for LazyColumn,</text>
    <text x="74" y="252" fill="#ddd6ff" font-size="26" font-weight="500">LazyRow and LazyVerticalGrid</text>
    <text x="74" y="310" fill="#ffb59f" font-size="19" font-family="'JetBrains Mono', Menlo, monospace">ReorderableItem(state, key) { isDragging -&gt; }</text>
    <g font-size="16" font-weight="600" fill="#efeaff">
      <rect x="74" y="340" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="134" y="364" text-anchor="middle">Long press</text>
      <rect x="204" y="340" width="120" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="264" y="364" text-anchor="middle">Auto scroll</text>
      <rect x="334" y="340" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="409" y="364" text-anchor="middle">Grids &amp; spans</text>
      <rect x="494" y="340" width="150" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="569" y="364" text-anchor="middle">Locked items</text>
    </g>
    <g font-size="16" font-weight="600" fill="#efeaff">
      <rect x="74" y="388" width="200" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="174" y="412" text-anchor="middle">D-pad &amp; keyboard</text>
      <rect x="284" y="388" width="210" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="389" y="412" text-anchor="middle">Accessibility actions</text>
      <rect x="504" y="388" width="140" height="36" rx="18" fill="#ffffff" fill-opacity="0.1"/>
      <text x="574" y="412" text-anchor="middle">Haptics</text>
    </g>
    <text x="74" y="486" fill="#ffb59f" font-size="17" font-weight="600" fill-opacity="0.9">Phone · tablet · TV · Pure Kotlin core · minSdk 24</text>

    <!-- Phone: a playlist with one row lifted mid-drag and a gap below it -->
    <g transform="translate(720 52)" filter="url(#shadow)">
      <rect width="250" height="456" rx="34" fill="#0f0b24"/>
      <rect x="10" y="10" width="230" height="436" rx="26" fill="url(#screen)"/>
      <rect x="28" y="34" width="110" height="12" rx="6" fill="#1c1b21"/>
      <rect x="28" y="54" width="150" height="7" rx="3.5" fill="#9b96a6"/>
      <!-- pinned -->
      <rect x="22" y="78" width="206" height="52" rx="14" fill="#e6deff"/>
      <rect x="32" y="88" width="32" height="32" rx="8" fill="#f2994a"/>
      <rect x="74" y="94" width="90" height="8" rx="4" fill="#1c1b21"/>
      <rect x="74" y="108" width="70" height="6" rx="3" fill="#6f6a7a"/>
      <path d="M208 98h-1v-2a4 4 0 0 0-8 0v2h-1a1.6 1.6 0 0 0-1.6 1.6v8a1.6 1.6 0 0 0 1.6 1.6h10a1.6 1.6 0 0 0 1.6-1.6v-8A1.6 1.6 0 0 0 208 98zm-7-2a2 2 0 0 1 4 0v2h-4z" fill="#170b5e"/>
      <!-- rows -->
      <g>
        <rect x="22" y="140" width="206" height="52" rx="14" fill="#ffffff"/>
        <rect x="32" y="150" width="32" height="32" rx="8" fill="#6c5ce7"/>
        <rect x="74" y="156" width="96" height="8" rx="4" fill="#1c1b21"/>
        <rect x="74" y="170" width="64" height="6" rx="3" fill="#9b96a6"/>
        <g fill="#9b96a6"><circle cx="206" cy="160" r="2.2"/><circle cx="213" cy="160" r="2.2"/><circle cx="206" cy="166" r="2.2"/><circle cx="213" cy="166" r="2.2"/><circle cx="206" cy="172" r="2.2"/><circle cx="213" cy="172" r="2.2"/></g>
      </g>
      <g>
        <rect x="22" y="202" width="206" height="52" rx="14" fill="#ffffff"/>
        <rect x="32" y="212" width="32" height="32" rx="8" fill="#00a8a8"/>
        <rect x="74" y="218" width="84" height="8" rx="4" fill="#1c1b21"/>
        <rect x="74" y="232" width="70" height="6" rx="3" fill="#9b96a6"/>
        <g fill="#9b96a6"><circle cx="206" cy="222" r="2.2"/><circle cx="213" cy="222" r="2.2"/><circle cx="206" cy="228" r="2.2"/><circle cx="213" cy="228" r="2.2"/><circle cx="206" cy="234" r="2.2"/><circle cx="213" cy="234" r="2.2"/></g>
      </g>
      <!-- gap where the dragged row will land -->
      <rect x="22" y="264" width="206" height="52" rx="14" fill="none" stroke="#5a4bc2" stroke-width="2" stroke-dasharray="6 6" stroke-opacity="0.6"/>
      <g>
        <rect x="22" y="326" width="206" height="52" rx="14" fill="#ffffff"/>
        <rect x="32" y="336" width="32" height="32" rx="8" fill="#0984e3"/>
        <rect x="74" y="342" width="80" height="8" rx="4" fill="#1c1b21"/>
        <rect x="74" y="356" width="60" height="6" rx="3" fill="#9b96a6"/>
        <g fill="#9b96a6"><circle cx="206" cy="346" r="2.2"/><circle cx="213" cy="346" r="2.2"/><circle cx="206" cy="352" r="2.2"/><circle cx="213" cy="352" r="2.2"/><circle cx="206" cy="358" r="2.2"/><circle cx="213" cy="358" r="2.2"/></g>
      </g>
      <g>
        <rect x="22" y="388" width="206" height="40" rx="14" fill="#ffffff"/>
        <rect x="32" y="396" width="24" height="24" rx="6" fill="#2d3436"/>
        <rect x="66" y="402" width="90" height="8" rx="4" fill="#1c1b21"/>
      </g>
      <!-- lifted row -->
      <g filter="url(#lift)" transform="translate(-6 -2) scale(1.03)">
        <rect x="22" y="240" width="206" height="52" rx="14" fill="#eae6f3"/>
        <rect x="32" y="250" width="32" height="32" rx="8" fill="#e84393"/>
        <rect x="74" y="256" width="78" height="8" rx="4" fill="#1c1b21"/>
        <rect x="74" y="270" width="88" height="6" rx="3" fill="#6f6a7a"/>
        <circle cx="210" cy="266" r="16" fill="#5a4bc2"/>
        <g fill="#ffffff"><circle cx="206" cy="260" r="2.2"/><circle cx="213" cy="260" r="2.2"/><circle cx="206" cy="266" r="2.2"/><circle cx="213" cy="266" r="2.2"/><circle cx="206" cy="272" r="2.2"/><circle cx="213" cy="272" r="2.2"/></g>
      </g>
    </g>

    <!-- Grid of widgets with one tile lifted -->
    <g transform="translate(1004 112)" filter="url(#shadow)">
      <rect width="230" height="300" rx="26" fill="#0f0b24"/>
      <rect x="10" y="10" width="210" height="280" rx="18" fill="url(#screen)"/>
      <rect x="22" y="24" width="186" height="30" rx="15" fill="#ffffff" stroke="#cac4d0"/>
      <rect x="22" y="64" width="90" height="62" rx="14" fill="#ffffff"/>
      <circle cx="40" cy="82" r="9" fill="#0984e3"/>
      <rect x="118" y="64" width="90" height="62" rx="14" fill="#ffffff"/>
      <circle cx="136" cy="82" r="9" fill="#e17055"/>
      <rect x="22" y="136" width="42" height="62" rx="12" fill="#ffffff"/>
      <rect x="70" y="136" width="42" height="62" rx="12" fill="none" stroke="#5a4bc2" stroke-width="2" stroke-dasharray="5 5" stroke-opacity="0.6"/>
      <rect x="118" y="136" width="42" height="62" rx="12" fill="#ffffff"/>
      <rect x="166" y="136" width="42" height="62" rx="12" fill="#ffffff"/>
      <rect x="22" y="208" width="42" height="62" rx="12" fill="#ffffff"/>
      <rect x="70" y="208" width="42" height="62" rx="12" fill="#ffffff"/>
      <rect x="118" y="208" width="90" height="62" rx="12" fill="#ffffff"/>
      <circle cx="35" cy="150" r="6" fill="#2d3436"/>
      <circle cx="131" cy="150" r="6" fill="#e84393"/>
      <circle cx="179" cy="150" r="6" fill="#6c5ce7"/>
      <circle cx="35" cy="222" r="6" fill="#00b894"/>
      <circle cx="83" cy="222" r="6" fill="#55a630"/>
      <circle cx="131" cy="222" r="6" fill="#00a8a8"/>
      <g filter="url(#lift)">
        <rect x="84" y="160" width="44" height="64" rx="12" fill="#eae6f3"/>
        <circle cx="98" cy="175" r="6" fill="#fdcb6e"/>
      </g>
    </g>
  </g>
</svg>
